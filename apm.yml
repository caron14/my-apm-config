name: my-apm-config
version: 0.1.0
description: "Standard AI configuration managed by APM"
dependencies:
  apm:
    # Skills from GitHub repository
    - anthropics/skills/skills/skill-creator
    - anthropics/skills/skills/pdf
    - anthropics/skills/skills/docx
    - anthropics/skills/skills/xlsx
    - anthropics/skills/skills/claude-api
    - anthropics/skills/skills/doc-coauthoring
  mcp:
    # MCP managed via uvx (PyPI)
    - name: mcp-bigquery
      registry: false
      transport: stdio
      command: uvx
      args: ["mcp-bigquery"]
      env:
        BQ_PROJECT: "YOUR_GCP_PROJECT_ID"
    - name: mcp-duckvault
      registry: false
      transport: stdio
      command: uvx
      args: ["duckvault", "/path/to/your/obsidian/vault"]
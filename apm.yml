name: my-apm-config
version: 0.1.0
description: "Standard AI configuration managed by APM"
dependencies:
  apm:
    # Skills from GitHub repository
    - anthropics/skills/skills/skill-creator
    - anthropics/skills/skills/skill-creator
    - anthropics/skills/skills/pdf
  mcp:
    # MPC from GitHub repository
    - name: mcp-bigquery
      registry: false
      transport: stdio
      command: uvx
      args: ["--from", "git+https://github.com/caron14/mcp-bigquery.git", "mcp-bigquery"]
      env:
        BQ_PROJECT: "YOUR_GCP_PROJECT_ID"
    - name: mcp-duckvault
      registry: false
      transport: stdio
      command: uvx
      args: ["--from", "git+https://github.com/caron14/mcp-duckvault.git", "duckvault", "/path/to/your/obsidian/vault"]
